<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — MedQueue</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto min-h-screen max-w-2xl bg-white px-4 pb-28 sm:px-6">
    <header class="border-b border-slate-200 py-5"><a href="index.html" class="text-sm font-semibold text-blue-700">MedQueue</a><h1 class="mt-4 text-2xl font-semibold">Кабинет</h1></header>
    <div id="message" class="mt-4 hidden rounded-xl border p-3 text-sm" role="status"></div>
    <section id="auth-view" class="mt-6">
      <div class="grid grid-cols-2 gap-2 rounded-xl bg-slate-100 p-1"><button id="login-tab" class="rounded-lg bg-white px-3 py-2 text-sm font-semibold shadow-sm">Вход</button><button id="register-tab" class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-500">Регистрация</button></div>
      <form id="login-form" class="mt-5 space-y-4 rounded-2xl border border-slate-200 p-4 sm:p-6">
        <h2 class="text-lg font-bold">Войти в аккаунт</h2>
        <label class="block text-sm font-medium">Почта<input name="email" type="email" autocomplete="email" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3 outline-none focus:border-blue-500"></label>
        <label class="block text-sm font-medium">Пароль<input name="password" type="password" autocomplete="current-password" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3 outline-none focus:border-blue-500"></label>
        <button class="w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white">Войти</button>
      </form>
      <form id="register-form" class="mt-5 hidden space-y-4 rounded-2xl border border-slate-200 p-4 sm:p-6">
        <h2 class="text-lg font-bold">Создать аккаунт</h2>
        <label class="block text-sm font-medium">Я регистрируюсь как<select name="role" id="role" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"><option value="patient">Пациент</option><option value="clinic">Стоматология</option></select></label>
        <label class="block text-sm font-medium"><span id="name-label">Имя и фамилия</span><input name="name" minlength="2" maxlength="100" autocomplete="name" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"></label>
        <label class="block text-sm font-medium">Почта<input name="email" type="email" autocomplete="email" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"></label>
        <label class="block text-sm font-medium">Телефон<input name="phone" type="tel" minlength="7" maxlength="30" autocomplete="tel" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"></label>
        <div id="clinic-fields" class="hidden space-y-4">
          <label class="block text-sm font-medium">Название клиники<input name="clinic_name" minlength="2" maxlength="160" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"></label>
          <label class="block text-sm font-medium">Адрес клиники<input name="clinic_address" minlength="3" maxlength="240" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"></label>
          <p class="rounded-xl bg-amber-50 p-3 text-xs leading-5 text-amber-800">Заявка появится в панели владельца сайта. Расписание станет доступно после одобрения.</p>
        </div>
        <label class="block text-sm font-medium">Пароль<input name="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-3"><span class="mt-1 block text-xs text-slate-500">Не менее 8 символов</span></label>
        <button class="w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white">Зарегистрироваться</button>
      </form>
    </section>
    <section id="patient-view" class="mt-6 hidden">
      <div class="flex items-start justify-between gap-3"><div><p class="text-sm text-slate-500">Вы вошли как пациент</p><h2 id="patient-name" class="mt-1 text-xl font-bold"></h2><p id="patient-email" class="mt-1 text-sm text-slate-500"></p></div><button id="logout" class="rounded-lg border px-3 py-2 text-sm">Выйти</button></div>
      <div class="mt-6 flex items-center justify-between"><h2 class="text-lg font-bold">Мои записи</h2><a href="index.html" class="text-sm font-semibold text-blue-700">Найти время</a></div><div id="appointments" class="mt-3 space-y-3"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span>Главная</span></a>
    <a href="clinics.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V7l9-4 9 4v14M3 11h18M8 11v10m8-10v10"></path></svg><span>Клиники</span></a>
    <a href="favorites.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11S3.2 13.8 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"></path></svg><span>Избранное</span></a>
    <a href="account.html" class="nav-item is-current"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2z"></path></svg><span>Кабинет</span></a>
  </nav>
  <script>
    const message=document.getElementById('message'), authView=document.getElementById('auth-view'), patientView=document.getElementById('patient-view'), loginForm=document.getElementById('login-form'), registerForm=document.getElementById('register-form');
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось выполнить запрос');return data}
    function notice(text,bad=false){message.textContent=text;message.className=`mt-4 rounded-xl border p-3 text-sm ${bad?'border-rose-200 bg-rose-50 text-rose-700':'border-emerald-200 bg-emerald-50 text-emerald-800'}`}
    function goRole(user){if(user.role==='admin'){location.replace('site-admin.html');return}if(user.role==='clinic'){location.replace('admin.html');return}}
    async function showPatient(user){authView.classList.add('hidden');patientView.classList.remove('hidden');document.getElementById('patient-name').textContent=user.name;document.getElementById('patient-email').textContent=user.email;const list=document.getElementById('appointments');try{const items=await api('/api/patient/appointments');list.replaceChildren();if(!items.length){list.textContent='Записей пока нет.';return}items.forEach(item=>{const card=document.createElement('article');card.className='rounded-xl border p-4';const title=document.createElement('p');title.className='font-semibold';title.textContent=item.slot.clinic_name;const detail=document.createElement('p');detail.className='mt-1 text-sm text-slate-600';detail.textContent=`${item.slot.service} · ${item.slot.date} · ${item.slot.time}`;card.append(title,detail);list.append(card)})}catch(e){notice(e.message,true)}}
    function redirectNext(user){const next=new URLSearchParams(location.search).get('next')||'';if(user.role==='patient'&&/^booking\.html\?slot_id=\d+$/.test(next)){location.replace(next);return}goRole(user);if(user.role==='patient')showPatient(user)}
    document.getElementById('login-tab').onclick=()=>{loginForm.classList.remove('hidden');registerForm.classList.add('hidden');document.getElementById('login-tab').className='rounded-lg bg-white px-3 py-2 text-sm font-semibold shadow-sm';document.getElementById('register-tab').className='rounded-lg px-3 py-2 text-sm font-semibold text-slate-500'};
    document.getElementById('register-tab').onclick=()=>{registerForm.classList.remove('hidden');loginForm.classList.add('hidden');document.getElementById('register-tab').className='rounded-lg bg-white px-3 py-2 text-sm font-semibold shadow-sm';document.getElementById('login-tab').className='rounded-lg px-3 py-2 text-sm font-semibold text-slate-500'};
    document.getElementById('role').onchange=e=>{const clinic=e.target.value==='clinic';document.getElementById('clinic-fields').classList.toggle('hidden',!clinic);document.getElementById('name-label').textContent=clinic?'Контактное лицо':'Имя и фамилия';registerForm.elements.clinic_name.required=clinic;registerForm.elements.clinic_address.required=clinic};
    loginForm.onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(loginForm));redirectNext(await api('/api/login',{method:'POST',body:JSON.stringify(data)}))}catch(error){notice(error.message,true)}};
    registerForm.onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(registerForm));const user=await api('/api/register',{method:'POST',body:JSON.stringify(data)});if(user.role==='clinic'){notice('Заявка создана. Войдите в кабинет клиники, чтобы смотреть статус проверки.');goRole(user)}else redirectNext(user)}catch(error){notice(error.message,true)}};
    document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});location.reload()};
    api('/api/me').then(user=>{if(user.role==='patient')showPatient(user);else goRole(user)}).catch(()=>{});
  </script>
</body></html>
