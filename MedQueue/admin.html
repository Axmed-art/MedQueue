<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель клиники — MedQueue</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#2563EB' }, boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.07)' } } } }</script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <main class="mx-auto min-h-screen max-w-3xl bg-slate-50 px-4 pb-28 sm:px-6">
    <!-- Шапка панели: возврат на сайт и ручное обновление данных с сервера. -->
    <header class="flex items-center justify-between gap-3 pt-6">
      <div class="flex min-w-0 items-center gap-3"><a href="index.html" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-slate-200 bg-white text-lg text-slate-500 transition hover:border-blue-300 hover:text-blue-600" aria-label="На главную">‹</a><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-blue-600">SMILE CLINIC</p><h1 class="mt-0.5 truncate text-lg font-bold">Панель клиники</h1></div></div>
      <button id="refresh-button" type="button" class="shrink-0 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-xs font-bold text-slate-600 transition hover:border-blue-300 hover:text-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-100">↻ <span class="hidden sm:inline">Обновить</span></button>
    </header>

    <!-- Счётчики помогают быстро понять, сколько слотов занято и доступно. -->
    <section class="mt-6" aria-label="Сводка клиники">
      <div class="grid grid-cols-3 gap-2 sm:gap-3">
        <article class="rounded-2xl border border-slate-200 bg-white p-3 shadow-soft sm:p-4"><p class="text-[10px] font-semibold text-slate-500 sm:text-xs">Записи</p><p id="stat-appointments" class="mt-2 text-xl font-bold text-slate-900 sm:text-2xl">—</p><p class="mt-1 text-[9px] text-slate-400 sm:text-[10px]">всего пациентов</p></article>
        <article class="rounded-2xl border border-emerald-100 bg-emerald-50 p-3 shadow-soft sm:p-4"><p class="text-[10px] font-semibold text-emerald-700 sm:text-xs">Свободно</p><p id="stat-available" class="mt-2 text-xl font-bold text-emerald-800 sm:text-2xl">—</p><p class="mt-1 text-[9px] text-emerald-700/70 sm:text-[10px]">времени для записи</p></article>
        <article class="rounded-2xl border border-blue-100 bg-blue-50 p-3 shadow-soft sm:p-4"><p class="text-[10px] font-semibold text-blue-700 sm:text-xs">Занято</p><p id="stat-booked" class="mt-2 text-xl font-bold text-blue-800 sm:text-2xl">—</p><p class="mt-1 text-[9px] text-blue-700/70 sm:text-[10px]">слотов в расписании</p></article>
      </div>
    </section>

    <div id="page-error" class="mt-4 hidden rounded-xl border border-rose-200 bg-rose-50 p-4 text-xs leading-5 text-rose-700" role="alert"></div>

    <!-- Форма расписания создаёт слот; цена подставляется по выбранной услуге. -->
    <section class="mt-7" aria-labelledby="create-slot-title">
      <div><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">Расписание</p><h2 id="create-slot-title" class="mt-1 text-base font-bold">Добавить свободное время</h2></div>
      <form id="slot-form" class="mt-3 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-soft sm:grid-cols-2 sm:p-5">
        <label class="text-xs font-bold">Услуга
          <select id="service" name="service" required class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-normal outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            <option value="Лечение кариеса">Лечение кариеса</option>
            <option value="Профессиональная чистка">Профессиональная чистка</option>
            <option value="Острая боль">Острая боль</option>
          </select>
        </label>
        <label class="text-xs font-bold">Цена, ₸
          <input id="price" name="price" type="number" min="500" step="500" value="15000" required class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-normal outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </label>
        <label class="text-xs font-bold">Дата
          <input id="slot-date" name="date" type="date" required class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-normal outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </label>
        <label class="text-xs font-bold">Время
          <input name="time" type="time" required class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-normal outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </label>
        <button id="add-slot-button" type="submit" class="rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold text-white shadow-md shadow-blue-200 transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 sm:col-span-2">＋ Добавить слот</button>
        <p id="slot-message" class="hidden text-xs sm:col-span-2" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Список слотов показывает занятость и разрешает удалять только свободное время. -->
    <section class="mt-8" aria-labelledby="slots-title">
      <div class="flex items-end justify-between gap-3"><div><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">Слоты</p><h2 id="slots-title" class="mt-1 text-base font-bold">Расписание клиники</h2></div><span id="slot-count" class="rounded-full bg-slate-200 px-2.5 py-1 text-[10px] font-bold text-slate-600"></span></div>
      <div id="slots-list" class="mt-3 space-y-2"></div>
    </section>

    <!-- Поиск и фильтр работают по загруженным записям, не отправляя новый запрос при каждом вводе. -->
    <section class="mt-8" aria-labelledby="appointments-title">
      <div class="flex items-end justify-between gap-3"><div><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">Клиенты</p><h2 id="appointments-title" class="mt-1 text-base font-bold">Записи пациентов</h2></div><span id="appointment-count" class="rounded-full bg-blue-50 px-2.5 py-1 text-[10px] font-bold text-blue-700"></span></div>
      <div class="mt-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-soft sm:p-4">
        <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto_auto]">
          <label class="relative"><span class="sr-only">Поиск записей</span><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">⌕</span><input id="appointment-search" type="search" placeholder="Имя, телефон или услуга" class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-9 pr-3 text-xs outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"></label>
          <label><span class="sr-only">Фильтр услуги</span><select id="appointment-service" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"><option value="">Все услуги</option></select></label>
          <button id="clear-filters" type="button" class="rounded-xl border border-slate-200 px-3 py-2.5 text-xs font-semibold text-slate-600 transition hover:border-blue-300 hover:text-blue-700">Сбросить</button>
        </div>
      </div>
      <div id="appointments-list" class="mt-3 space-y-2"></div>
    </section>
  </main>

  <script>
    // Основные элементы формы расписания и фильтра записей.
    const slotForm = document.getElementById('slot-form');
    const slotMessage = document.getElementById('slot-message');
    const slotDate = document.getElementById('slot-date');
    const serviceSelect = document.getElementById('service');
    const priceInput = document.getElementById('price');
    const appointmentSearch = document.getElementById('appointment-search');
    const appointmentService = document.getElementById('appointment-service');
    const suggestedPrices = { 'Лечение кариеса': 15000, 'Профессиональная чистка': 12000, 'Острая боль': 8000 };
    const now = new Date();
    const localToday = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    slotDate.min = localToday;
    // Подставляем типовую цену, но администратор может изменить её вручную.
    serviceSelect.addEventListener('change', () => { priceInput.value = suggestedPrices[serviceSelect.value] || ''; });

    // Кэш записей нужен, чтобы мгновенно применять поиск и фильтр услуги.
    let allAppointments = [];

    // Единое отображение дат в расписании и списке пациентов.
    function formatDate(value) {
      return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(value + 'T12:00:00'));
    }

    // Общая обёртка над fetch обрабатывает JSON и сообщения об ошибках API.
    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Не удалось выполнить запрос');
      return data;
    }

    // Сообщение под формой подтверждает успешное действие или объясняет ошибку.
    function showMessage(element, message, isError = false) {
      element.textContent = message;
      element.className = `text-xs sm:col-span-2 ${isError ? 'text-rose-600' : 'text-emerald-700'}`;
    }

    // Строим список слотов и связываем занятый слот с данными пациента.
    function renderSlots(slots, appointments) {
      const list = document.getElementById('slots-list');
      list.replaceChildren();
      document.getElementById('slot-count').textContent = `${slots.length} всего`;
      const bookingBySlot = new Map(appointments.map((appointment) => [appointment.slot.id, appointment]));
      if (!slots.length) {
        const empty = document.createElement('p');
        empty.className = 'rounded-xl border border-slate-200 bg-white p-4 text-xs text-slate-500';
        empty.textContent = 'Слотов пока нет. Добавьте первое время выше.';
        list.append(empty);
        return;
      }
      slots.forEach((slot) => {
        const card = document.createElement('article');
        card.className = 'flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-soft';
        const details = document.createElement('div');
        details.className = 'min-w-0';
        const title = document.createElement('p');
        title.className = 'text-xs font-bold';
        title.textContent = `${slot.service} · ${formatDate(slot.date)} в ${slot.time}`;
        const appointment = bookingBySlot.get(slot.id);
        const meta = document.createElement('p');
        meta.className = 'mt-1 text-[11px] text-slate-500';
        meta.textContent = `${slot.price.toLocaleString('ru-RU')} ₸ · ${appointment ? `Пациент: ${appointment.patient_name}` : 'Свободно'}`;
        details.append(title, meta);
        card.append(details);
        if (!slot.booked) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'shrink-0 rounded-lg border border-rose-100 px-3 py-2 text-[11px] font-semibold text-rose-600 transition hover:bg-rose-50';
          button.textContent = 'Удалить';
          button.addEventListener('click', async () => {
            button.disabled = true;
            try {
              await api(`/api/slots/${slot.id}`, { method: 'DELETE' });
              await loadDashboard();
            } catch (error) {
              showPageError(error.message);
              button.disabled = false;
            }
          });
          card.append(button);
        } else {
          const badge = document.createElement('span');
          badge.className = 'shrink-0 rounded-full bg-blue-50 px-2.5 py-1 text-[10px] font-bold text-blue-700';
          badge.textContent = 'Занято';
          card.append(badge);
        }
        list.append(card);
      });
    }

    // Фильтруем записи по имени, телефону, услуге и дате, затем рисуем карточки.
    function renderAppointments() {
      const list = document.getElementById('appointments-list');
      const query = appointmentSearch.value.trim().toLocaleLowerCase('ru');
      const service = appointmentService.value;
      const filtered = allAppointments.filter((appointment) => {
        const searchable = `${appointment.patient_name} ${appointment.phone} ${appointment.slot.service} ${appointment.slot.date} ${appointment.slot.time}`.toLocaleLowerCase('ru');
        return searchable.includes(query) && (!service || appointment.slot.service === service);
      });
      list.replaceChildren();
      document.getElementById('appointment-count').textContent = query || service ? `${filtered.length} из ${allAppointments.length}` : `${allAppointments.length} всего`;
      if (!filtered.length) {
        const empty = document.createElement('p');
        empty.className = 'rounded-xl border border-slate-200 bg-white p-4 text-xs leading-5 text-slate-500';
        empty.textContent = allAppointments.length ? 'По заданным фильтрам записей не найдено. Измените поиск или сбросьте фильтры.' : 'Пока нет записей. Новые бронирования появятся здесь.';
        list.append(empty);
        return;
      }
      filtered.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'rounded-2xl border border-slate-200 bg-white p-4 shadow-soft';
        const top = document.createElement('div');
        top.className = 'flex items-start justify-between gap-3';
        const identity = document.createElement('div');
        identity.className = 'min-w-0';
        const name = document.createElement('p');
        name.className = 'truncate text-sm font-bold';
        name.textContent = item.patient_name;
        const phone = document.createElement('a');
        phone.className = 'mt-1 inline-flex text-xs font-medium text-blue-700 hover:underline';
        phone.href = `tel:${item.phone.replace(/[^+\d]/g, '')}`;
        phone.textContent = item.phone;
        identity.append(name, phone);
        const badge = document.createElement('span');
        badge.className = 'shrink-0 rounded-full bg-emerald-50 px-2.5 py-1 text-[10px] font-bold text-emerald-700';
        badge.textContent = 'Подтверждена';
        top.append(identity, badge);
        const detail = document.createElement('p');
        detail.className = 'mt-3 border-t border-slate-100 pt-3 text-xs font-semibold';
        detail.textContent = `${item.slot.service} · ${formatDate(item.slot.date)} в ${item.slot.time}`;
        const price = document.createElement('p');
        price.className = 'mt-1 text-[11px] text-slate-500';
        price.textContent = `${item.slot.price.toLocaleString('ru-RU')} ₸ · ${item.slot.clinic_name}`;
        card.append(top, detail, price);
        list.append(card);
      });
    }

    // Если сервер недоступен, показываем ошибку и кнопку повторной загрузки.
    function showPageError(message) {
      const error = document.getElementById('page-error');
      error.replaceChildren();
      const text = document.createElement('p');
      text.textContent = `${message}. Проверьте, что сервер запущен.`;
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'mt-2 font-bold underline underline-offset-2';
      retry.textContent = 'Повторить загрузку';
      retry.addEventListener('click', loadDashboard);
      error.append(text, retry);
      error.classList.remove('hidden');
    }

    // Загружаем расписание и записи параллельно, затем обновляем счётчики и списки.
    async function loadDashboard() {
      document.getElementById('page-error').classList.add('hidden');
      document.getElementById('refresh-button').disabled = true;
      try {
        const [slots, appointments] = await Promise.all([api('/api/slots?all=1'), api('/api/appointments')]);
        allAppointments = appointments;
        const freeCount = slots.filter((slot) => !slot.booked).length;
        const bookedCount = slots.length - freeCount;
        document.getElementById('stat-appointments').textContent = appointments.length;
        document.getElementById('stat-available').textContent = freeCount;
        document.getElementById('stat-booked').textContent = bookedCount;
        appointmentService.replaceChildren(new Option('Все услуги', ''));
        [...new Set(appointments.map((appointment) => appointment.slot.service))].sort().forEach((service) => appointmentService.add(new Option(service, service)));
        renderSlots(slots, appointments);
        renderAppointments();
      } catch (error) {
        showPageError(error.message);
      } finally {
        document.getElementById('refresh-button').disabled = false;
      }
    }

    // Отправляем новый слот API; после ответа очищаем форму и перечитываем панель.
    slotForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const addButton = document.getElementById('add-slot-button');
      addButton.disabled = true;
      addButton.textContent = 'Добавляем…';
      const formData = new FormData(slotForm);
      try {
        await api('/api/slots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ service: formData.get('service'), date: formData.get('date'), time: formData.get('time'), price: Number(formData.get('price')) }),
        });
        showMessage(slotMessage, 'Свободное время добавлено.', false);
        slotForm.reset();
        priceInput.value = '15000';
        await loadDashboard();
      } catch (error) {
        showMessage(slotMessage, error.message, true);
      } finally {
        addButton.disabled = false;
        addButton.textContent = '＋ Добавить слот';
      }
    });

    // Подключаем обновление, живой поиск, фильтр услуги и сброс фильтров.
    document.getElementById('refresh-button').addEventListener('click', loadDashboard);
    appointmentSearch.addEventListener('input', renderAppointments);
    appointmentService.addEventListener('change', renderAppointments);
    document.getElementById('clear-filters').addEventListener('click', () => {
      appointmentSearch.value = '';
      appointmentService.value = '';
      renderAppointments();
      appointmentSearch.focus();
    });
    loadDashboard();
  </script>
  <!-- Панель клиники открывается из отдельного выбора «Для стоматологии». -->
  <nav class="bottom-nav" aria-label="Основная навигация">

  </nav>
</body>
</html>
