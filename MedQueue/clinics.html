<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клиники Алматы — MedQueue</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#2563EB' },
          boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.07)' }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: light; --ink: #172334; --muted: #687586; --line: #e5e9ee; --blue: #1677d2; }
    body { background: #f7f8fa !important; color: var(--ink) !important; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .site-shell { background: #fff !important; padding-bottom: 112px; }
    .site-shell > header { padding-top: 16px; }
    /* Знак обрезан из исходного логотипа и стоит рядом с текстовым названием. */
    .brand-row { display: flex; min-height: 56px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .brand-link { display: inline-flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; }
    .brand-symbol { position: relative; display: block; width: 58px; height: 42px; overflow: hidden; }
    .brand-symbol img { position: absolute; top: -1px; left: -5px; width: 72px; max-width: none; height: auto; }
    .brand-wordmark { display: flex; flex-direction: column; gap: 1px; }
    .brand-name { color: #172334; font-size: 23px; font-weight: 750; letter-spacing: -.055em; line-height: 1; }
    .brand-name span { color: #1677d2; }
    .brand-tagline { color: #687586; font-size: 10px; line-height: 1.3; }
    .city-label { display: inline-flex; align-items: center; gap: 5px; color: #586678; font-size: 12px; font-weight: 550; }
    .city-label svg { width: 15px; height: 15px; fill: none; stroke: #1677d2; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .intro { display: grid; gap: 22px; padding: 30px 0 24px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .intro h1 { margin: 7px 0 0; color: var(--ink); font-size: clamp(27px, 4vw, 34px); font-weight: 650; letter-spacing: -.03em; line-height: 1.16; }
    .intro-note { max-width: 430px; margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    /* Поиск и фильтры используют простые контуры вместо градиентов и теней. */
    .search-field { display: flex; min-height: 48px; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid #dce2e8; border-radius: 8px; background: #fff; color: #8591a0; }
    .search-field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px #1677d21a; }
    .search-field svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
    .search-field input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .site-shell section[aria-labelledby="services-title"], .site-shell section[aria-labelledby="clinics-title"] { margin-top: 26px; }
    .site-shell h2 { font-size: 19px; font-weight: 620; letter-spacing: -.02em; }
    .service-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .service-chip { padding: 8px 11px; border: 1px solid #dce2e8; border-radius: 6px; background: #fff; color: #455365; font-size: 12px; font-weight: 550; transition: border-color .15s, color .15s, background .15s; }
    .service-chip:hover { border-color: #96bde2; }
    .service-chip[aria-pressed="true"] { border-color: #b8d4eb; background: #f2f8fd; color: #1268b7; }
    .clinic-card { border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 17px; }
    .clinic-card h3 { color: var(--ink); font-size: 16px; font-weight: 650; line-height: 1.35; }
    .clinic-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .clinic-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
    .clinic-stat-label { color: #7a8795; font-size: 10px; }
    .clinic-stat-value { margin-top: 3px; color: var(--ink); font-size: 13px; font-weight: 650; }
    .clinic-action { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; border-radius: 6px; background: var(--blue); padding: 0 14px; color: #fff; font-size: 12px; font-weight: 650; text-decoration: none; }
    .clinic-action:hover { background: #1268b7; }
    @media (min-width: 640px) {
      .site-shell > header { padding-top: 22px; }
      .brand-symbol { width: 62px; height: 44px; }
      .brand-symbol img { width: 76px; }
      .brand-name { font-size: 25px; }
      .brand-tagline { font-size: 11px; }
      .intro { grid-template-columns: 1fr minmax(280px, 390px); align-items: end; padding: 48px 0 32px; }
      .site-shell section[aria-labelledby="services-title"], .site-shell section[aria-labelledby="clinics-title"] { margin-top: 34px; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main id="home" class="site-shell mx-auto min-h-screen max-w-5xl bg-slate-50 px-4 pb-28 sm:px-6">
    <!-- Шапка ставит знак и название рядом, а город оставляет отдельной подсказкой. -->
    <header class="site-header">
      <div class="brand-row">
        <a href="index.html" class="brand-link" aria-label="MedQueue, на главную">
          <span class="brand-symbol"><img src="assets/medqueue-logo.jpg" alt=""></span>
          <span class="brand-wordmark"><span class="brand-name">Med<span>Queue</span></span><span class="brand-tagline">Запись к стоматологу</span></span>
        </a>
        <span class="city-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"></path><circle cx="12" cy="10" r="2"></circle></svg>Алматы</span>
      </div>
      <!-- Короткое описание продукта и поле поиска для фильтрации каталога. -->
      <section class="intro mt-5"><div class="intro-copy"><p class="eyebrow">Каталог · Алматы</p><h1>Выберите стоматологию</h1><p class="intro-note">Сравните доступное время и стоимость приёма.</p></div><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="clinic-search" type="search" placeholder="Название или адрес" aria-label="Поиск по клиникам"></label></section>
    </header>

    <!-- Быстрые кнопки выбирают услугу и оставляют клиники с подходящими слотами. -->
    <section class="mt-7" aria-labelledby="services-title">
      <div class="flex items-end justify-between">
        <div><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">Шаг 1</p><h2 id="services-title" class="mt-1 text-base font-bold">Какая услуга нужна?</h2></div>
        <button id="clear-service" type="button" class="text-xs font-semibold text-blue-600">Сбросить</button>
      </div>
      <div class="service-list mt-3" role="group" aria-label="Фильтр по услуге"><button type="button" data-service-filter="" aria-pressed="true" class="service-chip">Все услуги</button><button type="button" data-service-filter="Первичная консультация" aria-pressed="false" class="service-chip">Первичная консультация</button><button type="button" data-service-filter="Лечение кариеса" aria-pressed="false" class="service-chip">Лечение кариеса</button><button type="button" data-service-filter="Профессиональная чистка" aria-pressed="false" class="service-chip">Профессиональная чистка</button><button type="button" data-service-filter="Ортопедическая стоматология" aria-pressed="false" class="service-chip">Ортопедическая стоматология</button><button type="button" data-service-filter="Ортодонтия" aria-pressed="false" class="service-chip">Ортодонтия</button><button type="button" data-service-filter="Хирургическая стоматология" aria-pressed="false" class="service-chip">Хирургическая стоматология</button><button type="button" data-service-filter="Приём при острой боли" aria-pressed="false" class="service-chip">Приём при острой боли</button></div>
    </section>

    <!-- Каталог: у Smile Clinic данные расписания настоящие, остальные клиники пока без онлайн-записи. -->
    <section id="clinics" class="mt-7" aria-labelledby="clinics-title">
      <div class="flex items-end justify-between">
        <div><p class="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-400">Алматы · сегодня и ближайшие дни</p><h2 id="clinics-title" class="mt-1 text-base font-bold">Клиники рядом</h2></div>
        <span id="clinic-count" class="text-xs font-semibold text-slate-500">Загрузка…</span>
      </div>
      <p id="results-message" class="mt-3 hidden rounded-xl border border-slate-200 bg-white p-4 text-xs leading-5 text-slate-500" role="status" aria-live="polite"></p>

      <div id="clinic-cards" class="mt-4 space-y-3"></div>
    </section>
  </main>
  <!-- Четыре основных раздела доступны с любой страницы сайта. -->
  <nav class="bottom-nav" aria-label="Основная навигация">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span>Главная</span></a>
    <a href="clinics.html" class="nav-item is-current" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V7l9-4 9 4v14M3 11h18M8 11v10m8-10v10M9 7h.01M15 7h.01"></path></svg><span>Клиники</span></a>
    <a href="favorites.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11S3.2 13.8 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"></path></svg><span>Избранное</span></a>
    <a href="account.html" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2z"></path></svg><span>Кабинет</span></a>
  </nav>
  <script>
    const search=document.getElementById('clinic-search');
    const cards=document.getElementById('clinic-cards');
    const countLabel=document.getElementById('clinic-count');
    const message=document.getElementById('results-message');
    const buttons=[...document.querySelectorAll('[data-service-filter]')];
    let clinics=[],slots=[],service='',currentUser=null,favorites=new Set();

    function makeElement(tag,className,text){const node=document.createElement(tag);node.className=className;if(text)node.textContent=text;return node}
    function render(){
      const query=search.value.trim().toLocaleLowerCase('ru');
      const found=clinics.filter(c=>`${c.name} ${c.address||''}`.toLocaleLowerCase('ru').includes(query)&&(!service||slots.some(slot=>slot.clinic_name===c.name&&slot.service===service&&new Date(`${slot.date}T${slot.time}:00`)>new Date())));
      countLabel.textContent=`Найдено: ${found.length}`;
      cards.replaceChildren();
      const hasResults=found.length>0;
      message.classList.toggle('hidden',hasResults);
      message.textContent=clinics.length===0?'Пока нет клиник в каталоге.':service?'На эту услугу пока нет свободного времени.':'По этому запросу клиник не найдено.';

      found.forEach(clinic=>{
        const now=new Date();
        const own=slots.filter(slot=>slot.clinic_name===clinic.name&&(!service||slot.service===service))
          .filter(slot=>new Date(`${slot.date}T${slot.time}:00`)>=now)
          .sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
        const card=makeElement('article','clinic-card');
        const header=makeElement('div','flex items-start justify-between gap-4');
        const details=makeElement('div','min-w-0');
        details.append(makeElement('h3','',clinic.name));
        const contact=[clinic.address,clinic.phone].filter(Boolean).join(' · ');
        if(contact)details.append(makeElement('p','clinic-meta mt-1',contact));
        const controls=makeElement('div','flex shrink-0 flex-col items-end gap-2');
        controls.append(makeElement('span','text-[11px] font-medium text-slate-500',own.length?`Свободно: ${own.length}`:'Нет свободного времени'));
        if(!currentUser||currentUser.role==='patient'){
          const saved=favorites.has(clinic.name);
          const favorite=makeElement('button','text-[11px] font-semibold text-blue-700 hover:underline',saved?'♥ В избранном':'♡ В избранное');
          favorite.type='button';favorite.setAttribute('aria-pressed',String(saved));
          favorite.onclick=async()=>{
            if(!currentUser){location.href='account.html?next=clinics.html';return}
            favorite.disabled=true;
            try{
              const response=await fetch(saved?`/api/patient/favorites/${encodeURIComponent(clinic.name)}`:'/api/patient/favorites',{
                method:saved?'DELETE':'POST',headers:{'Content-Type':'application/json'},
                ...(saved?{}:{body:JSON.stringify({clinic_name:clinic.name})}),
              });
              const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось обновить избранное');
              if(saved)favorites.delete(clinic.name);else favorites.add(clinic.name);render();
            }catch(error){message.textContent=error.message;message.classList.remove('hidden');favorite.disabled=false}
          };
          controls.append(favorite);
        }
        header.append(details,controls);

        const stats=makeElement('div','clinic-stats');
        const prices=own.map(slot=>Number(slot.price)).filter(price=>Number.isFinite(price)&&price>0);
        const lowest=prices.length?Math.min(...prices):null;
        const price=lowest===null?'—':`${lowest.toLocaleString('ru-RU')} ₸`;
        const nearest=own.length?`${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(`${own[0].date}T12:00:00`))}, ${own[0].time}`:'—';
        [[price==='—'?price:`от ${price}`,'Стоимость'],[nearest,'Ближайшее время'],[String(own.length),'Свободных слотов']].forEach(([value,label])=>{
          const item=makeElement('div','');item.append(makeElement('p','clinic-stat-label',label),makeElement('p','clinic-stat-value',value));stats.append(item);
        });
        const footer=makeElement('div','mt-4 flex items-center justify-end');
        const link=makeElement('a','clinic-action','Открыть расписание →');
        link.href=`clinic.html?clinic_name=${encodeURIComponent(clinic.name)}${service?`&service=${encodeURIComponent(service)}`:''}`;
        footer.append(link);card.append(header,stats,footer);cards.append(card);
      });
    }
    buttons.forEach(button=>button.addEventListener('click',()=>{
      service=button.dataset.serviceFilter;
      buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      render();
    }));
    document.getElementById('clear-service').onclick=()=>{search.value='';buttons.find(button=>!button.dataset.serviceFilter)?.click();search.focus()};
    search.addEventListener('input',render);
    async function loadAccountState(){
      try{
        const response=await fetch('/api/me');if(!response.ok)return;
        currentUser=await response.json();
        if(currentUser.role==='patient'){
          const saved=await fetch('/api/patient/favorites');if(saved.ok)favorites=new Set(await saved.json());
        }
      }catch{}
    }
    Promise.all([fetch('/api/clinics').then(response=>response.json()),fetch('/api/slots').then(response=>response.json()),loadAccountState()])
      .then(([clinicData,slotData])=>{clinics=clinicData;slots=slotData;render()})
      .catch(()=>{cards.replaceChildren();countLabel.textContent='';message.textContent='Не удалось загрузить каталог. Попробуйте обновить страницу.';message.classList.remove('hidden')});
  </script>
</body>
</html>
