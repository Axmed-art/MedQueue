<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Админ-панель — MedQueue</title><link rel="stylesheet" href="assets/site.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><main class="mx-auto max-w-5xl px-4 pb-24"><header class="flex items-center justify-between py-6"><div><a href="index.html" class="text-sm font-semibold text-blue-700">MedQueue</a><h1 class="mt-2 text-2xl font-bold">Панель владельца сайта</h1></div><button id="logout" class="rounded-lg border bg-white px-3 py-2 text-sm">Выйти</button></header><div id="message" class="hidden rounded-xl bg-rose-50 p-3 text-sm text-rose-700"></div><section id="stats" class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3"></section><section class="mt-8"><h2 class="text-xl font-bold">Заявки клиник</h2><div id="clinics" class="mt-3 space-y-3"></div></section><section class="mt-8"><h2 class="text-xl font-bold">Аккаунты</h2><div class="mt-3 overflow-x-auto rounded-xl border bg-white"><table class="w-full min-w-[600px] text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-3">Имя / клиника</th><th class="p-3">Почта</th><th class="p-3">Телефон</th><th class="p-3">Тип</th><th class="p-3">Статус</th></tr></thead><tbody id="users"></tbody></table></div></section></main>
<script>
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Запрос не выполнен');return d}
const msg=document.getElementById('message');function error(e){msg.textContent=e.message;msg.classList.remove('hidden')}
function stat(title,value){const card=document.createElement('article');card.className='rounded-xl border bg-white p-4';const a=document.createElement('p');a.className='text-xs text-slate-500';a.textContent=title;const b=document.createElement('p');b.className='mt-2 text-2xl font-bold';b.textContent=value;card.append(a,b);return card}
async function load(){const [s,clinics,users]=await Promise.all([api('/api/admin/overview'),api('/api/admin/clinics'),api('/api/admin/users')]);document.getElementById('stats').replaceChildren(...[['Пациенты',s.patients],['Клиники',s.clinics],['На проверке',s.clinics_pending],['Одобрены',s.clinics_approved],['Записи',s.appointments],['Свободно / занято',`${s.slots_available} / ${s.slots_booked}`]].map(x=>stat(...x)));
const list=document.getElementById('clinics');list.replaceChildren();clinics.forEach(c=>{const card=document.createElement('article');card.className='rounded-xl border bg-white p-4';const title=document.createElement('h3');title.className='font-bold';title.textContent=c.clinic_name;const detail=document.createElement('p');detail.className='mt-1 text-sm text-slate-600';detail.textContent=`${c.email} · ${c.phone} · ${c.clinic_address} · ${c.clinic_status==='pending'?'ожидает проверки':c.clinic_status==='approved'?'одобрена':'отклонена'}`;card.append(title,detail);if(c.clinic_status==='pending'){const actions=document.createElement('div');actions.className='mt-3 flex gap-2';[['Одобрить','approved'],['Отклонить','rejected']].forEach(([label,status])=>{const b=document.createElement('button');b.className=status==='approved'?'rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white':'rounded-lg bg-slate-200 px-3 py-2 text-sm font-semibold';b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/clinic-decision',{method:'POST',body:JSON.stringify({clinic_id:c.id,status})});await load()}catch(e){error(e)}};actions.append(b)});card.append(actions)}list.append(card)});if(!clinics.length)list.textContent='Заявок клиник пока нет.';
const body=document.getElementById('users');body.replaceChildren();users.forEach(u=>{const row=document.createElement('tr');row.className='border-t';[u.role==='clinic'?u.clinic_name:u.name,u.email,u.phone,u.role==='admin'?'Администратор':u.role==='clinic'?'Клиника':'Пациент',u.clinic_status||'—'].forEach(v=>{const cell=document.createElement('td');cell.className='p-3';cell.textContent=v||'—';row.append(cell)});body.append(row)})}
document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});location.replace('account.html')};
api('/api/me').then(user=>{if(user.role!=='admin'){location.replace('account.html');return}load().catch(error)}).catch(()=>location.replace('account.html?next=site-admin.html'));
</script></body></html>
