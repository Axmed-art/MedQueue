<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение записи — MedQueue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#2563EB' }, boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.07)' } } } }</script>
</head>
<body class="min-h-screen bg-[#f5f5f5] text-slate-900 antialiased">
  <main class="mx-auto min-h-screen max-w-md bg-[#f5f5f5] px-4 pb-8">
    <header class="flex items-center gap-3 pt-6"><a href="clinic.html" class="text-lg text-slate-500" aria-label="Назад">‹</a><div><p class="text-[11px] font-semibold text-slate-400">КЛИНИКА</p><h1 class="mt-0.5 text-base font-bold">Подтверждение</h1></div></header>

    <section id="booking-form" class="mt-5">
      <div class="rounded-xl border border-slate-200 bg-white p-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3"><div><h2 id="clinic-name" class="text-sm font-bold">Загрузка клиники…</h2><p id="slot-date-time" class="mt-1 text-[11px] text-slate-500"></p></div><span id="slot-price" class="text-xs font-bold text-blue-600"></span></div>
        <dl class="mt-3 space-y-2 text-xs"><div class="flex justify-between gap-4"><dt class="text-slate-500">Врач</dt><dd class="text-right font-semibold">Анна Петрова</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-500">Услуга</dt><dd id="slot-service" class="text-right font-semibold">—</dd></div></dl>
      </div>
      <p id="load-error" class="mt-3 hidden rounded-lg bg-rose-50 p-3 text-xs text-rose-700" role="alert"></p>
      <form id="appointment-form" class="mt-5 space-y-3">
        <div><label for="name" class="mb-1.5 block text-xs font-semibold">Ваше имя</label><input id="name" name="name" type="text" maxlength="100" autocomplete="name" placeholder="Например, Алия" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-3 text-xs outline-none placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-100"></div>
        <div><label for="phone" class="mb-1.5 block text-xs font-semibold">Номер телефона</label><input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="+7 (___) ___-__-__" pattern="[+0-9() -]{7,30}" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-3 text-xs outline-none placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-100"></div>
        <button id="submit-button" type="submit" class="mt-2 flex w-full items-center justify-center rounded-lg bg-blue-600 px-4 py-3 text-xs font-bold text-white disabled:cursor-not-allowed disabled:bg-slate-300">Подтвердить запись</button>
        <p class="text-center text-[10px] leading-4 text-slate-400">Нажимая на кнопку, вы соглашаетесь с обработкой персональных данных</p>
      </form>
    </section>

    <section id="success-state" class="hidden pt-24 text-center" aria-live="polite"><div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-4xl text-emerald-600">✓</div><h2 class="mt-6 text-2xl font-bold">Вы успешно записаны!</h2><p id="success-details" class="mx-auto mt-3 max-w-xs text-sm leading-6 text-slate-500"></p><a href="index.html" class="mt-8 inline-flex w-full items-center justify-center rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-200">На главную</a></section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slotId = params.get('slot_id');
    const form = document.getElementById('appointment-form');
    const submitButton = document.getElementById('submit-button');
    const loadError = document.getElementById('load-error');
    let selectedSlot = null;

    function formatDate(value) {
      return new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(value + 'T12:00:00'));
    }

    function localDateTime(value) {
      const [year, month, day] = value.date.split('-').map(Number);
      const [hours, minutes] = value.time.split(':').map(Number);
      return new Date(year, month - 1, day, hours, minutes);
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Не удалось выполнить запрос');
      return data;
    }

    async function loadSlot() {
      if (!slotId || !/^\d+$/.test(slotId)) {
        loadError.textContent = 'Сначала выберите свободное время на странице клиники.';
        loadError.classList.remove('hidden');
        submitButton.disabled = true;
        return;
      }
      try {
        selectedSlot = await api(`/api/slots/${encodeURIComponent(slotId)}`);
        if (selectedSlot.booked || localDateTime(selectedSlot) <= new Date()) {
          throw new Error('Это время уже недоступно. Вернитесь в клинику и выберите другой слот.');
        }
        document.getElementById('clinic-name').textContent = selectedSlot.clinic_name;
        document.getElementById('slot-date-time').textContent = `${formatDate(selectedSlot.date)} в ${selectedSlot.time}`;
        document.getElementById('slot-price').textContent = `${selectedSlot.price.toLocaleString('ru-RU')} ₸`;
        document.getElementById('slot-service').textContent = selectedSlot.service;
      } catch (error) {
        loadError.textContent = error.message;
        loadError.classList.remove('hidden');
        submitButton.disabled = true;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!selectedSlot || !form.reportValidity()) return;
      submitButton.disabled = true;
      submitButton.textContent = 'Сохраняем запись…';
      loadError.classList.add('hidden');
      const formData = new FormData(form);
      try {
        const appointment = await api('/api/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slot_id: selectedSlot.id,
            name: formData.get('name'),
            phone: formData.get('phone'),
          }),
        });
        document.getElementById('booking-form').classList.add('hidden');
        document.getElementById('success-details').textContent = `Запись №${appointment.id}: ${appointment.slot.service}, ${formatDate(appointment.slot.date)} в ${appointment.slot.time}. ${appointment.slot.clinic_name}, ${appointment.slot.price.toLocaleString('ru-RU')} ₸. Сохраните это подтверждение; SMS не отправляется.`;
        document.getElementById('success-state').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        loadError.textContent = error.message;
        loadError.classList.remove('hidden');
        submitButton.disabled = false;
        submitButton.textContent = 'Подтвердить запись';
      }
    });

    loadSlot();
  </script>
</body>
</html>
